<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Birebir Ders</title>
<script src="https://muhsinengin.com/ortak/ana-sayfa.js" defer></script>
<style>
  :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; --bg: #f3f4f6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  a { color: var(--accent); }
  .kart { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .dar { max-width: 420px; margin: 10vh auto; }
  .panel { max-width: 980px; margin: 16px auto; padding: 0 16px; display: grid; gap: 16px; }
  .ust { margin: 0; color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { margin: 6px 0 8px; font-size: 24px; } h2 { margin: 0 0 12px; font-size: 18px; } h3 { font-size: 15px; margin: 16px 0 8px; }
  .aciklama { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .uyari { background: #fef3c7; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  .form { display: grid; gap: 12px; margin-top: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; font-size: 15px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; min-width: 0; }
  input.pin { font-size: 24px; letter-spacing: .3em; text-align: center; font-variant-numeric: tabular-nums; }
  button, .dugme { font: inherit; font-size: 14px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  .ana { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ince { background: transparent; }
  .satir { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 12px; }
  .mesaj { min-height: 1.2em; font-size: 14px; margin: 6px 0 0; }
  .mesaj[data-kind="hata"] { color: #b91c1c; } .mesaj[data-kind="tamam"] { color: #15803d; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .bar span { color: var(--muted); margin-left: auto; }
  .kart > ana-sayfa-dugmesi { display: inline-flex; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 6px 4px; }
  td { border-bottom: 1px solid var(--line); padding: 8px 4px; vertical-align: middle; }
  td.sag { text-align: right; white-space: nowrap; }
  .etiket { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; }
  .etiket.suruyor { background: #bbf7d0; } .etiket.planli { background: #dbeafe; } .etiket.bitti { background: #f3f4f6; color: var(--muted); }
  .bos { color: var(--muted); font-size: 14px; }
  .liste { list-style: none; padding: 0; margin: 0; } .liste li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  dialog { border: 1px solid var(--line); border-radius: 12px; max-width: 480px; width: calc(100% - 32px); }
  dialog label { margin-top: 8px; }
  .dersbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 12px; background: #111827; color: #e5e7eb; font-size: 13px; }
  .dersbar button { color: #e5e7eb; border-color: #374151; padding: 4px 10px; font-size: 13px; }
  #kayit[data-k="verildi"] { color: #86efac; } #kayit[data-k="reddedildi"] { color: #fca5a5; }
  #dersbilgi { margin-right: auto; }
  @media (max-width: 600px) { th:nth-child(3), td:nth-child(3) { display: none; } td.sag { white-space: normal; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="dist/app.js"></script>
</body>
</html>
